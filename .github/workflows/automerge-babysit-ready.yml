name: Arm auto-merge for babysit-ready PRs

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Existing babysit:ready PR to re-check and arm"
        required: true
        type: string

# Native auto-merge itself waits for every branch-protection-required check.
# Contents write permits the guarded, post-merge source-branch cleanup.
permissions:
  contents: write
  pull-requests: write

# Keep readiness withdrawal ordered after any arming run for the same PR.
concurrency:
  group: babysit-ready-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  arm-native-auto-merge:
    # This early gate avoids starting a write-capable job for unrelated PRs.
    # The REST check below repeats the condition so workflow_dispatch is equally safe.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.user.login == 'autojack-bot[bot]' &&
       contains(github.event.pull_request.labels.*.name, 'babysit:ready'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Re-check the load-bearing babysit contract
        id: eligible
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e '
            .draft == false and
            .user.login == "autojack-bot[bot]" and
            any(.labels[]; .name == "babysit:ready")
          ' <<<"${pr}" >/dev/null

      - name: Arm GitHub native squash auto-merge
        # Do not poll for checks here. GitHub owns the wait and merges only after
        # every required status check is successful.
        run: |
          gh pr merge "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --auto \
            --squash

  disarm-removed-readiness:
    # The label is load-bearing: withdrawing it must revoke a pending merge.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'unlabeled' &&
      github.event.label.name == 'babysit:ready' &&
      github.event.pull_request.user.login == 'autojack-bot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Verify bot ownership and revoke pending native auto-merge
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e '.user.login == "autojack-bot[bot]"' <<<"${pr}" >/dev/null
          if [[ "$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "true" ]]; then
            gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --disable-auto
          fi

  delete-merged-source-branch:
    # `--auto` completes later, so branch deletion belongs to the closed event.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'autojack-bot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'babysit:ready')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Verify eligible merged PR and delete its source branch
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e --arg repository "${GITHUB_REPOSITORY}" '
            .merged_at != null and
            .user.login == "autojack-bot[bot]" and
            .head.repo.full_name == $repository and
            any(.labels[]; .name == "babysit:ready")
          ' <<<"${pr}" >/dev/null
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"
          fi
